<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CineSic</h1>
  <p>Movie and Music Database</p>

  <!-- Form to add entries -->
  <form id="entryForm">
    <input type="text" id="title" placeholder="Title" required>
    <input type="text" id="year" placeholder="Year" required>
    <input type="text" id="genre" placeholder="Genre" required>
    <input type="text" id="language" placeholder="Language" required>
    <button type="submit">Add Entry</button>
  </form>

  <!-- Search bar -->
  <input type="text" id="searchBar" placeholder="Search by title, genre, or language">

  <!-- Display entries -->
  <ul id="entryList"></ul>

  <!-- Linking JavaScript -->
  <script src="script.js"></script>
</body>
</html>
